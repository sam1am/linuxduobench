# Surface Duo (1st gen) HiFi verb. Speaker: MultiMedia1 (PCM 0) -> SLIMBUS_0_RX -> WCD9340 RX INT7 -> the WSA8815
# amp "SpkrLeft" (the phone's one loudspeaker). Microphones: DMIC3 + DMIC2 -> DEC7/DEC8 -> SLIMBUS_0_TX ->
# MultiMedia2 (PCM 2), so playback and capture can run at once (DMIC1 is not connected on this board).
SectionVerb {
	EnableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 1"
		cset "name='SLIM RX0 MUX' AIF1_PB"
		cset "name='RX INT7_1 MIX1 INP0' RX0"
		cset "name='COMP7 Switch' 1"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
		cset "name='AIF1_CAP Mixer SLIM TX7' 1"
		cset "name='CDC_IF TX7 MUX' DEC7"
		cset "name='ADC MUX7' DMIC"
		cset "name='DMIC MUX7' DMIC3"
		cset "name='AIF1_CAP Mixer SLIM TX8' 1"
		cset "name='CDC_IF TX8 MUX' DEC8"
		cset "name='ADC MUX8' DMIC"
		cset "name='DMIC MUX8' DMIC2"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"
	EnableSequence [
		# 84 = 0 dB, fixed: the control goes to +40 dB (124) and as PipeWire's volume it sat at 111 = +27 dB, clipping
		# the signal - request: "speaker seems sharp and grainy" (2026-11-06). Volume is PipeWire's software volume.
		cset "name='RX7 Digital Volume' 84"
		cset "name='SpkrLeft COMP Switch' 1"
		cset "name='SpkrLeft BOOST Switch' 1"
		cset "name='SpkrLeft DAC Switch' 1"
		cset "name='SpkrLeft VISENSE Switch' 0"
		# WSA PA gain: the control is inverted, 12 = +18 dB ... 0 = 0 dB in 1.5 dB steps (wsa881x_put_pa_gain).
		# 8 = +12 dB (request 2026-11-13: the speaker was barely audible; Android runs 0 dB plus its DSP's MBDRC).
		# No speaker protection here: keep the PipeWire volume moderate.
		cset "name='SpkrLeft PA Volume' 8"
	]
	DisableSequence [
		cset "name='SpkrLeft DAC Switch' 0"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Microphones"
	EnableSequence [
		cset "name='DEC7 Volume' 84"
		cset "name='DEC8 Volume' 84"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
	}
}
